<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <!-- Replaced by the app on mount. It stays visible when the mount never
         happens - a widget outside YouTrack, a module that failed to load, a Host
         API that refused to register - so the panel says something instead of
         showing an empty box. -->
    <div id="root">
      <p class="bootstrap">The report could not start. Reloading this page usually
        helps; if it does not, the app may need to be installed again.</p>
    </div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
